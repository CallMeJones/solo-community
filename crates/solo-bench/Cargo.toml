[package]
name = "solo-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Solo: benchmark harness and golden datasets (LongMemEval, MemoryAgentBench, p99 budgets)"
publish = false

[dependencies]
solo-core = { workspace = true }
solo-query = { workspace = true }
solo-storage = { workspace = true, features = ["test-support"] }
blake3 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }

[features]
default = []
bundled-embedder = ["solo-storage/bundled-embedder"]

# v0.8.0 P4: inherit the workspace's clippy lint configuration.
[lints]
workspace = true
