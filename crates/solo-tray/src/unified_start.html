<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121210;color:#f2f0eb;font:16px system-ui,sans-serif;display:flex;height:100vh}aside{width:228px;flex-shrink:0;border-right:1px solid #302e28;padding:34px 30px;display:flex;flex-direction:column}aside strong{font-size:34px;letter-spacing:-1px}aside p{font-size:14px;color:#aaa69e;line-height:1.6}aside small{margin-top:auto;color:#aaa69e}main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;overflow:auto}section{width:min(100%,480px)}h1{font-size:34px;letter-spacing:-1px;margin:0 0 16px}p{line-height:1.65;color:#aaa69e}label{display:block;margin:20px 0 8px}input[type=password]{display:block;width:100%;padding:14px;border:1px solid #49443b;border-radius:8px;background:#1d1c18;color:#f2f0eb;font:inherit}button{border:1px solid #49443b;background:#25231e;color:#f2f0eb;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer;margin:12px 8px 0 0}button.primary{background:#d28a3a;color:#17100b;font-weight:600;border-color:#d28a3a}button:disabled{opacity:.55;cursor:wait}input:focus-visible,button:focus-visible{outline:2px solid #d28a3a;outline-offset:3px}#message{color:#f2b35d;overflow-wrap:anywhere}#settings{border-top:1px solid #302e28;margin-top:30px;padding-top:18px}input[type=checkbox]{accent-color:#d28a3a} [hidden]{display:none!important}
</style><aside><strong>Solo</strong><p>Private memory for<br>a more capable you</p><small>Your library stays on this device.<br>No account required.</small></aside><main><section><h1 id="title">Opening Solo</h1><p id="description">Checking your local library…</p><p id="message" role="status" aria-live="polite"></p><form id="unlock" hidden><label for="passphrase">Library passphrase</label><input id="passphrase" type="password" autocomplete="current-password" required><div id="confirmation" hidden><label for="confirm">Confirm passphrase</label><input id="confirm" type="password" autocomplete="new-password"></div><label><input id="remember" type="checkbox"> Remember on this device</label><p id="recovery" hidden>Keep your passphrase somewhere safe. You’ll need it to open a backup on another device. Solo cannot recover a lost passphrase.</p><button class="primary" id="submit">Unlock library</button></form><div id="ready" hidden><button class="primary" id="continue">Return to memories</button><button id="restart">Restart Solo</button></div><div id="settings"><h2>On this device</h2><label><input id="autostart" type="checkbox"> Open Solo when I sign in to this computer</label><button id="forget" hidden>Forget saved unlock</button><button id="quit">Quit Solo</button></div></section></main>
<script>
let state={busy:true,create:false};const $=id=>document.getElementById(id);const send=data=>window.ipc.postMessage(JSON.stringify(data));
window.soloState=s=>{state=s;$('title').textContent=s.ready?'Your library is ready':s.busy?'Opening your library…':s.create?'Welcome to Solo':'Unlock your library';$('description').textContent=s.ready?'Your memories are available in this window.':s.create?'Create a private library on this device.':'Enter your existing passphrase to continue.';$('message').textContent=s.message;$('unlock').hidden=s.ready||s.busy;$('ready').hidden=!s.ready;$('confirmation').hidden=!s.create;$('recovery').hidden=!s.create;$('submit').textContent=s.create?'Create library':'Unlock library';$('submit').disabled=s.busy;$('autostart').checked=s.autostart;$('forget').hidden=!s.remember;};
$('unlock').onsubmit=e=>{e.preventDefault();if(state.busy)return;const passphrase=$('passphrase').value,confirm=$('confirm').value;send({action:'unlock',passphrase,confirm,create:state.create,remember:$('remember').checked});$('passphrase').value='';$('confirm').value='';state.busy=true;$('submit').disabled=true;};
$('continue').onclick=()=>send({action:'open'});$('restart').onclick=()=>send({action:'restart'});$('forget').onclick=()=>send({action:'forget'});$('quit').onclick=()=>send({action:'quit'});$('autostart').onchange=e=>send({action:'autostart',enabled:e.target.checked});
</script></html>
