name: Community multi-platform release candidate

# Build exact main-branch candidates. Publication is a separate, explicit
# release operation after every native package and its provenance is checked.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-multi-platform-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  community-ci:
    uses: ./.github/workflows/ci.yml

  native-packages:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      SOLO_CI_BUILD_NUMBER: ${{ github.run_number }}
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test -f "docs/releases/v${VERSION}.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/solo-artifacts" >> "$GITHUB_ENV"
      - name: Use exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify embedded Community Web
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:pilot
          npm run verify:embedded
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Install Ubuntu desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils pkg-config libssl-dev \
            libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
            libxkbcommon-dev libxkbcommon-x11-0 xvfb dbus-x11
      - name: Build pinned Intel Mac embedding runtime
        if: matrix.target == 'x86_64-apple-darwin'
        run: bash scripts/build_intel_macos_runtime.sh
      - name: Cache Cargo outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: community-release-${{ matrix.target }}-rust-1.95.0
          cache-on-failure: true
      - name: Build native CLI and desktop
        run: cargo build --locked --release --target ${{ matrix.target }} -p solo-cli -p solo-tray
      - name: Bundle Intel Mac runtime and notices
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          cp -L "$ORT_LIB_LOCATION"/*.dylib "target/$TARGET/release/"
          cp "$SOLO_ONNX_SOURCE/LICENSE" "target/$TARGET/release/onnxruntime-LICENSE.txt"
          cp "$SOLO_ONNX_SOURCE/ThirdPartyNotices.txt" "target/$TARGET/release/onnxruntime-NOTICES.txt"
      - name: Fetch pinned offline model (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/fetch_embedding_model.sh "target/$TARGET/release/models/all-MiniLM-L6-v2"
      - name: Fetch pinned offline model and MSVC runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch_embedding_model.ps1 -Destination "target/$env:TARGET/release/models/all-MiniLM-L6-v2"
          ./scripts/bundle_msvc_runtime.ps1 -ReleaseDir "target/$env:TARGET/release"
      - name: Package and certify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path "target/$env:TARGET/release").Path
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIR -Force | Out-Null
          $files = @((Join-Path $release 'solo.exe'), (Join-Path $release 'solo-tray.exe'), (Join-Path $release 'models'))
          $files += @(Get-ChildItem -LiteralPath $release -Filter '*.dll' -File | ForEach-Object FullName)
          Compress-Archive -LiteralPath $files -DestinationPath "$env:ARTIFACT_DIR/solo-cli-$env:VERSION-$env:TARGET.zip"
          choco install innosetup --version=6.7.1 --allow-downgrade --no-progress -y
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { throw "Inno Setup install failed: $LASTEXITCODE" }
          $iscc = @("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe", "${env:ProgramFiles}/Inno Setup 6/ISCC.exe", "${env:LOCALAPPDATA}/Programs/Inno Setup 6/ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe was not installed' }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$release" "/DOutputDir=$env:ARTIFACT_DIR" installer/windows/SoloSetup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          $setup = "$env:ARTIFACT_DIR/SoloSetup-$env:VERSION-x86_64.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected preview signature state: $($signature.Status)" }
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows_installed_smoke.ps1 -DataDir "$env:RUNNER_TEMP/solo-installed-smoke" -ExpectedVersion $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows smoke failed' }
          $unpacked = "$env:RUNNER_TEMP/solo-unpacked"
          Expand-Archive -LiteralPath "$env:ARTIFACT_DIR/solo-cli-$env:VERSION-$env:TARGET.zip" -DestinationPath $unpacked
          $version = (& "$unpacked/solo.exe" --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notlike "solo $env:VERSION+*") { throw "Wrong ZIP version: $version" }
      - name: Package and certify Ubuntu install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          tar -czf "$ARTIFACT_DIR/solo-cli-$VERSION-$TARGET.tar.gz" -C "target/$TARGET/release" solo solo-tray models
          bash scripts/package_ubuntu_deb.sh "$VERSION" "target/$TARGET/release" "$ARTIFACT_DIR"
          sudo apt install -y "$ARTIFACT_DIR/solo-$VERSION-ubuntu24.04-amd64.deb"
          bash scripts/linux_installed_smoke.sh /usr/bin/solo "$RUNNER_TEMP/solo-installed-smoke" /usr/share/solo/models/all-MiniLM-L6-v2
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" dbus-run-session -- \
            bash scripts/linux_tray_gui_smoke.sh /usr/bin/solo-tray /usr/bin/solo 15
          mkdir "$RUNNER_TEMP/solo-unpacked"
          tar -xzf "$ARTIFACT_DIR/solo-cli-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP/solo-unpacked"
          "$RUNNER_TEMP/solo-unpacked/solo" --version
      - name: Package and certify relocated Mac app and DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_macos.py "$VERSION" "$TARGET" "target/$TARGET/release" "$ARTIFACT_DIR"
          mkdir "$RUNNER_TEMP/solo-unpacked"
          tar -xzf "$ARTIFACT_DIR/solo-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP/solo-unpacked"
          PAYLOAD="$RUNNER_TEMP/solo-unpacked/Solo.app/Contents/MacOS"
          bash scripts/linux_installed_smoke.sh "$PAYLOAD/solo" "$RUNNER_TEMP/solo-installed-smoke" "$PAYLOAD/models/all-MiniLM-L6-v2"
          MOUNT="$RUNNER_TEMP/solo-dmg"
          mkdir "$MOUNT"
          hdiutil attach "$ARTIFACT_DIR/solo-$VERSION-$TARGET.dmg" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT"' EXIT
          codesign --verify --deep --strict "$MOUNT/Solo.app"
          "$MOUNT/Solo.app/Contents/MacOS/solo" --version
          "$MOUNT/Solo.app/Contents/MacOS/solo-tray" --version
      - name: Record release identity and checksums
        run: python scripts/release_manifest.py --directory "${{ env.ARTIFACT_DIR }}" --target "${{ matrix.target }}" --version "${{ env.VERSION }}"
      - name: Attest packages and manifests
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ env.ARTIFACT_DIR }}/*
      - name: Retain certified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solo-${{ matrix.target }}
          path: ${{ env.ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 30

  agent-plugin:
    name: Package assistant plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Package plugins and SDK starters
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          DESTINATION="$RUNNER_TEMP/solo-plugin-artifacts"
          python scripts/package_agent_plugin.py --output-dir "$DESTINATION"
          python sdks/package_starters.py --out "$DESTINATION" --check
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python scripts/release_manifest.py --directory "$DESTINATION" --target agent-plugins --version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: solo-agent-plugins
          path: ${{ runner.temp }}/solo-plugin-artifacts/*
          if-no-files-found: error
          retention-days: 30
