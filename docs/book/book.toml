[book]
title = "Solo — User Guide"
description = "Local-first personal memory for AI assistants. One encrypted Community library with optional consent-based Steward providers."
authors = ["Solo project"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/CallMeJones/solo-community"
edit-url-template = "https://github.com/CallMeJones/solo-community/edit/main/docs/book/{path}"
no-section-label = true

[output.html.fold]
enable = true
level = 1
